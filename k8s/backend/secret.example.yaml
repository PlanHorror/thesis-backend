# Backend Secrets
# Copy this file to secret.yaml and fill in your values
#
# DATABASE_URL format: postgresql://USER:PASSWORD@HOST:PORT/DATABASE?connection_limit=X&pool_timeout=Y
# Use postgres-service as host (Kubernetes service DNS name)
#
# Prisma connection pool settings (recommended for production):
#   connection_limit: max connections per pod (formula: max_postgres_connections / num_pods)
#   pool_timeout: seconds to wait for a connection before failing (default: 10)
#
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: thesis
  labels:
    app: backend
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:<your-password>@postgres-service:5432/thesis_db?connection_limit=20&pool_timeout=30
  JWT_SECRET: <your-jwt-secret>
